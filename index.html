<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão à Vista - Nissei</title>
    <style>
        /* Remove qualquer margem e força a ocupar a tela inteira */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #002b5e; /* Azul Nissei para preencher bordas se a TV for mais larga */
            overflow: hidden;
        }
        
        /* Configuração de Tela Cheia para as Imagens */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* object-fit: contain garante que a tabela não seja cortada. 
               Se preferir que a imagem estique para não deixar nenhuma borda azul, 
               mude a palavra "contain" para "fill" ou "cover" */
            object-fit: contain; 
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        
        .active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Capa inicial estática (A imagem que você fez o upload) -->
    <img src="capa.jpg" class="slide active" alt="Gestão à Vista - Capa">
    
    <!-- Imagens das tabelas (Atualizadas pelo robô todos os dias) -->
    <img src="slide_01.jpg" class="slide" alt="Slide 1">
    <img src="slide_02.jpg" class="slide" alt="Slide 2">
    <img src="slide_03.jpg" class="slide" alt="Slide 3">
    <img src="slide_04.jpg" class="slide" alt="Slide 4">

    <script>
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');

        // Alterna os slides a cada 15 segundos (15000 ms)
        setInterval(() => {
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + 1) % slides.length;
            slides[slideIndex].classList.add('active');
        }, 15000);

        // Recarrega a página invisivelmente a cada 2 horas (7200000 ms)
        // Isso garante que a TV puxe os PDFs novos gerados pelo robô
        setInterval(() => {
            window.location.reload(true);
        }, 7200000); 
    </script>

</body>
</html>
