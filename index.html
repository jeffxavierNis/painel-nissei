<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Gestão à Vista - Nissei</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: url('capa.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(10px); 
            z-index: 1;
        }

        .carousel-container {
            position: relative;
            width: 96vw; 
            height: 94vh; 
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            /* O fundo branco disfarça as margens do PDF, fundindo tudo numa só peça */
            background-color: #ffffff;
            overflow: hidden;
            z-index: 2;
        }

        .logo-nissei {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 250px;
            z-index: 10;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            transform-origin: center center;
            
            /* 
               scale(1.06) dá um zoom de 6% para maximizar o tamanho sem cortar o topo.
               Se ainda cortar algo, mude para 1.04. Se quiser maior, mude para 1.08.
            */
            transform: translateX(100%) scale(1.06);
            transition: transform 1s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .active {
            transform: translateX(0) scale(1.06);
        }

        .exit {
            transform: translateX(-100%) scale(1.06);
        }

        /* A capa tem definições separadas para não ter nenhum zoom e preencher o ecrã todo */
        #capa {
            object-fit: cover;
            transform: translateX(100%) scale(1);
        }
        #capa.active {
            transform: translateX(0) scale(1);
        }
        #capa.exit {
            transform: translateX(-100%) scale(1);
        }

        .no-transition {
            transition: none !important;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <img src="Nissei.png" class="logo-nissei" alt="Logo Nissei">

    <div class="carousel-container">
        <img src="capa.jpg" id="capa" class="slide active" alt="Gestão à Vista - Capa" data-time="15000">
        
        <img src="slide_01.jpg" class="slide" alt="Slide 1" data-time="45000">
        <img src="slide_02.jpg" class="slide" alt="Slide 2" data-time="45000">
        <img src="slide_03.jpg" class="slide" alt="Slide 3" data-time="45000">
        <img src="slide_04.jpg" class="slide" alt="Slide 4" data-time="45000">
    </div>

    <script>
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');
        let timer; 

        function showNextSlide() {
            let currentSlide = slides[slideIndex];
            slideIndex = (slideIndex + 1) % slides.length;
            let nextSlide = slides[slideIndex];

            nextSlide.classList.add('no-transition');
            nextSlide.classList.remove('exit', 'active');
            
            void nextSlide.offsetWidth; 
            nextSlide.classList.remove('no-transition');

            currentSlide.classList.remove('active');
            currentSlide.classList.add('exit');
            
            nextSlide.classList.add('active');

            let nextTime = parseInt(nextSlide.getAttribute('data-time')) || 30000;
            
            clearTimeout(timer);
            timer = setTimeout(showNextSlide, nextTime);
        }

        let initialTime = parseInt(slides[0].getAttribute('data-time')) || 15000;
        timer = setTimeout(showNextSlide, initialTime);

        setInterval(() => {
            window.location.reload(true);
        }, 7200000); 
    </script>

</body>
</html>
