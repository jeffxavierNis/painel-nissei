<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão à Vista - Nissei</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            /* A capa fica de fundo para preencher o espaço atrás do carrossel */
            background: url('capa.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* Máscara que escurece e desfoca o fundo, destacando a apresentação */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(10px); /* Efeito de vidro fosco */
            z-index: 1;
        }

        /* Contêiner principal com bordas arredondadas e sombra flutuante */
        .carousel-container {
            position: relative;
            width: 94vw; 
            height: 92vh; 
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            background-color: #ffffff;
            overflow: hidden;
            z-index: 2;
        }

        /* Configuração do Logo Nissei Flutuante */
        .logo-nissei {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 160px; /* Ajuste o tamanho da sua logo aqui */
            z-index: 10;
            /* Leve sombra para destacar a logo em fundos claros ou escuros */
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transform: translateX(100%) scale(1.04);
            transition: transform 1s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Configuração específica para retirar o zoom e ajustar a transição da CAPA */
        #capa {
            transform: translateX(100%) scale(1);
        }

        .active {
            transform: translateX(0) scale(1.04);
        }
        #capa.active {
            transform: translateX(0) scale(1);
        }

        .exit {
            transform: translateX(-100%) scale(1.04);
        }
        #capa.exit {
            transform: translateX(-100%) scale(1);
        }

        .no-transition {
            transition: none !important;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- O ficheiro Nissei.png foi atualizado aqui -->
    <img src="Nissei.png" class="logo-nissei" alt="Logo Nissei">

    <div class="carousel-container">
        <!-- O atributo data-time define os milissegundos que a imagem ficará na ecrã -->
        <!-- 15000 = 15 segundos para a Capa | 45000 = 45 segundos para os Relatórios -->
        <img src="capa.jpg" id="capa" class="slide active" alt="Gestão à Vista - Capa" data-time="15000">
        
        <img src="slide_01.jpg" class="slide" alt="Slide 1" data-time="45000">
        <img src="slide_02.jpg" class="slide" alt="Slide 2" data-time="45000">
        <img src="slide_03.jpg" class="slide" alt="Slide 3" data-time="45000">
        <img src="slide_04.jpg" class="slide" alt="Slide 4" data-time="45000">
    </div>

    <script>
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');
        let timer; 

        function showNextSlide() {
            let currentSlide = slides[slideIndex];
            slideIndex = (slideIndex + 1) % slides.length;
            let nextSlide = slides[slideIndex];

            nextSlide.classList.add('no-transition');
            nextSlide.classList.remove('exit', 'active');
            
            void nextSlide.offsetWidth; 
            nextSlide.classList.remove('no-transition');

            currentSlide.classList.remove('active');
            currentSlide.classList.add('exit');
            
            nextSlide.classList.add('active');

            let nextTime = parseInt(nextSlide.getAttribute('data-time')) || 30000;
            
            clearTimeout(timer);
            timer = setTimeout(showNextSlide, nextTime);
        }

        let initialTime = parseInt(slides[0].getAttribute('data-time')) || 15000;
        timer = setTimeout(showNextSlide, initialTime);

        setInterval(() => {
            window.location.reload(true);
        }, 7200000); 
    </script>

</body>
</html>
