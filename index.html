<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão à Vista - Nissei</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            /* Fundo branco funde-se com as margens do PDF */
            background-color: #ffffff; 
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            /* Mantém as proporções reais do texto e dos logótipos sem os achatar */
            object-fit: cover; 
            /* Desliza para a direita (100%) e aplica um zoom de 4% para cortar as margens brancas nativas */
            transform: translateX(100%) scale(1.04);
            transition: transform 1s ease-in-out;
        }
        
        .active {
            /* Slide no centro (0) com o zoom mantido */
            transform: translateX(0) scale(1.04);
        }

        .exit {
            /* Slide sai pela esquerda (-100%) com o zoom mantido */
            transform: translateX(-100%) scale(1.04);
        }

        .no-transition {
            transition: none !important;
        }
    </style>
</head>
<body>

    <!-- Capa inicial estática -->
    <img src="capa.jpg" class="slide active" alt="Gestão à Vista - Capa">
    
    <!-- Imagens das tabelas geradas automaticamente pelo robô -->
    <img src="slide_01.jpg" class="slide" alt="Slide 1">
    <img src="slide_02.jpg" class="slide" alt="Slide 2">
    <img src="slide_03.jpg" class="slide" alt="Slide 3">
    <img src="slide_04.jpg" class="slide" alt="Slide 4">

    <script>
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');

        // Alterna os slides a cada 15 segundos (15000 ms) com efeito contínuo
        setInterval(() => {
            let currentSlide = slides[slideIndex];
            
            // Calcula qual será o próximo slide
            slideIndex = (slideIndex + 1) % slides.length;
            let nextSlide = slides[slideIndex];

            // 1. Prepara o próximo slide: move-o secretamente para a direita sem animação
            nextSlide.classList.add('no-transition');
            nextSlide.classList.remove('exit', 'active');
            
            // Força o navegador a reconhecer a posição antes de devolver a animação
            void nextSlide.offsetWidth; 
            nextSlide.classList.remove('no-transition');

            // 2. Executa a transição animada (atual vai para esquerda, próximo vem da direita)
            currentSlide.classList.remove('active');
            currentSlide.classList.add('exit');
            
            nextSlide.classList.add('active');

        }, 15000);

        // Recarrega a página de forma invisível a cada 2 horas para puxar as imagens do dia
        setInterval(() => {
            window.location.reload(true);
        }, 7200000); 
    </script>

</body>
</html>
