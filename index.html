<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão à Vista - Nissei</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff; 
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            /* Configuração padrão para os PDFs (com zoom de 4%) */
            transform: translateX(100%) scale(1.04);
            transition: transform 1s ease-in-out;
        }

        /* Configuração específica para retirar o zoom da CAPA */
        #capa {
            transform: translateX(100%) scale(1);
        }
        
        .active {
            transform: translateX(0) scale(1.04);
        }
        #capa.active {
            transform: translateX(0) scale(1);
        }

        .exit {
            transform: translateX(-100%) scale(1.04);
        }
        #capa.exit {
            transform: translateX(-100%) scale(1);
        }

        .no-transition {
            transition: none !important;
        }
    </style>
</head>
<body>

    <!-- Capa inicial sem o zoom (identificada com id="capa") -->
    <img src="capa.jpg" id="capa" class="slide active" alt="Gestão à Vista - Capa">
    
    <!-- Imagens das tabelas geradas pelo robô -->
    <img src="slide_01.jpg" class="slide" alt="Slide 1">
    <img src="slide_02.jpg" class="slide" alt="Slide 2">
    <img src="slide_03.jpg" class="slide" alt="Slide 3">
    <img src="slide_04.jpg" class="slide" alt="Slide 4">

    <script>
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');

        setInterval(() => {
            let currentSlide = slides[slideIndex];
            slideIndex = (slideIndex + 1) % slides.length;
            let nextSlide = slides[slideIndex];

            nextSlide.classList.add('no-transition');
            nextSlide.classList.remove('exit', 'active');
            
            void nextSlide.offsetWidth; 
            nextSlide.classList.remove('no-transition');

            currentSlide.classList.remove('active');
            currentSlide.classList.add('exit');
            
            nextSlide.classList.add('active');

        }, 15000);

        setInterval(() => {
            window.location.reload(true);
        }, 7200000); 
    </script>

</body>
</html>
